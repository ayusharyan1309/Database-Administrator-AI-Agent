server:
  port: 8080

spring:
  application:
    name: optiq-backend

  # --- Monitored PostgreSQL database ---
  datasource:
    url: ${OPTIQ_DB_URL:jdbc:postgresql://localhost:5432/optiq_target}
    username: ${OPTIQ_DB_USERNAME:optiq_monitor}
    password: ${OPTIQ_DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  # --- Internal JPA store (tracks analyzed queries) ---
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# --- Firebase ---
# Non-secret: a project id and a path. The service account JSON itself stays
# out of the repo (gitignored) and out of the JAR — never put it under
# src/main/resources, which is committed and packaged.
#
# The path may be relative; it is resolved against both the working directory
# and the project root, so it works whether you run from ./ or ./backend.
optiq:
  firebase:
    credentials-file: ${OPTIQ_FIREBASE_CREDENTIALS:optiquery-b213a-firebase-adminsdk-fbsvc-b733505184.json}
    project-id: ${OPTIQ_FIREBASE_PROJECT_ID:optiquery-b213a}

  # Vendor-side admin token for /api/admin/**. A secret: supply it through the
  # environment, never here. Unset means those routes return 404.
  admin:
    token: ${OPTIQ_ADMIN_TOKEN:}

  # First-run seeds only. Once the app has started, these live in Settings and
  # the Settings page is authoritative; editing them here changes nothing on a
  # database that already has the rows.
  polling:
    interval-ms: ${OPTIQ_POLL_INTERVAL_MS:300000}       # 5 minutes default
    slow-query-threshold-ms: ${OPTIQ_SLOW_THRESHOLD_MS:500}
    max-queries-per-poll: ${OPTIQ_MAX_QUERIES_PER_POLL:10}

  # --- AI provider ---
  ai:
    provider: ${OPTIQ_AI_PROVIDER:openai}                 # "openai" or "anthropic"
    openai-api-key: ${OPENAI_API_KEY:}
    openai-model: ${OPENAI_MODEL:gpt-4o}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    anthropic-model: ${ANTHROPIC_MODEL:claude-sonnet-4-20250514}

  # --- Slack notifications ---
  slack:
    webhook-url: ${OPTIQ_SLACK_WEBHOOK_URL:}
    enabled: ${OPTIQ_SLACK_ENABLED:false}

# --- Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
