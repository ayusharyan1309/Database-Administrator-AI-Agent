server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;

    # The dashboard is a single-page app: /query/1 and /account are client
    # routes, not files. Without this fallback they 404 on refresh or on a
    # shared link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The app calls /api/... relatively, so nginx has to reach the backend.
    # Without this the container serves the UI and every request fails.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Analysis waits on an LLM; the default 60s cuts long diagnoses off.
        proxy_read_timeout 180s;
    }

    # Hashed asset filenames are immutable; index.html must never be cached or
    # a deploy leaves people on the old bundle.
    location ~* \.(js|css|woff2?|png|svg|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip             on;
    gzip_types       text/css application/javascript application/json image/svg+xml;
    gzip_min_length  1024;
}
